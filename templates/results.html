<!-- templates/results.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Feedback Results</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .controls { margin: 20px 0; text-align:center; }
    #feedbackTable { margin: 0 auto; width: 95%; max-width: 1100px; }
  </style>
</head>
<body>
  <div class="container my-4">
    <h2 class="text-center mb-3">Feedback Records</h2>

    <div class="controls">
      <label for="filterSelect" class="me-2">Show:</label>
      <select id="filterSelect" class="form-select d-inline-block" style="width:180px" onchange="filterFeedback()">
        <option value="all">All</option>
        <option value="Positive">Positive</option>
        <option value="Negative">Negative</option>
        <option value="Neutral">Neutral</option>
      </select>

      <!-- Client-side CSV download -->
      <button class="btn btn-primary ms-3" onclick="downloadClientCSV()">⬇ Download (visible rows)</button>

      <!-- Optional: server-side CSV download (works with DB filter) -->
      <button class="btn btn-outline-secondary ms-2" onclick="downloadServerCSV()">⬇ Download (server)</button>
    </div>

    <table id="feedbackTable" class="table table-striped table-bordered">
      <thead class="table-dark">
        <tr>
          <th>#</th>
          <th>Timestamp</th>
          <th>Sentence</th>
          <th>VADER</th>
          <th>TextBlob</th>
          <th>Sentiment</th>
        </tr>
      </thead>
      <tbody>
        {% for row in feedback %}
        <!-- adjust indices to match your rows: here row.timestamp, row.sentence, etc. -->
        <tr data-sentiment="{{ row.sentiment }}">
          <td>{{ loop.index }}</td>
          <td>{{ row.timestamp }}</td>
          <td>{{ row.sentence }}</td>
          <td>{{ row.vader_score }}</td>
          <td>{{ row.textblob_score }}</td>
          <td>{{ row.sentiment }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

<script>
/* Client-side filtering */
function filterFeedback() {
  const filter = document.getElementById('filterSelect').value;
  const rows = document.querySelectorAll('#feedbackTable tbody tr');

  rows.forEach(row => {
    const sentiment = (row.dataset.sentiment || '').trim();
    if (filter === 'all' || sentiment === filter) {
      row.style.display = '';
    } else {
      row.style.display = 'none';
    }
  });
}

/* Client-side CSV download of visible rows */
function downloadClientCSV() {
  const filter = document.getElementById('filterSelect').value;
  const rows = document.querySelectorAll('#feedbackTable tbody tr');
  let csv = ['Index,Timestamp,Sentence,VADER,TextBlob,Sentiment'];

  rows.forEach(row => {
    if (row.style.display === 'none') return; // skip hidden rows
    const cells = row.querySelectorAll('td');
    const rowVals = Array.from(cells).map(td => {
      // escape double quotes
      return '"' + td.innerText.replace(/"/g, '""') + '"';
    });
    csv.push(rowVals.join(','));
  });

  const csvStr = csv.join('\n');
  const blob = new Blob([csvStr], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const fname = (filter === 'all') ? 'feedback_all.csv' : `feedback_${filter.toLowerCase()}.csv`;
  a.download = fname;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

/* Optional: download server-side filtered CSV (calls endpoint /download_feedback_csv?filter=Positive) */
function downloadServerCSV() {
  const filter = document.getElementById('filterSelect').value;
  // navigate to the download URL (server will return CSV)
  const url = '/download_feedback_csv?filter=' + encodeURIComponent(filter);
  window.location = url;
}
</script>
</body>
</html>
