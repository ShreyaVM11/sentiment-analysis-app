<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Customer Feedback 💬</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Poppins", sans-serif;
      background: url("{{ url_for('static', filename='images/SentimentBack.jpeg') }}") center/cover no-repeat fixed;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 0;
    }
    .container {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      backdrop-filter: blur(6px);
      width: 90%;
      max-width: 700px;
      text-align: center;
    }
    h1 { font-size: 2rem; margin-bottom: 10px; }
    h3 { font-weight: normal; margin-bottom: 20px; font-size: 1.2rem; }
    img {
      width: 600px; max-width: 100%;
      border-radius: 12px;
      box-shadow: 0 0 10px gray;
      margin: 20px auto;
      display: block;
    }
    textarea {
      width: 100%;
      min-height: 100px;
      padding: 10px;
      border-radius: 10px;
      border: none;
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 1rem;
      outline: none;
      margin-bottom: 15px;
    }
    .button-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
    }
    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-weight: 600;
      color: #fff;
      font-size: 1rem;
      transition: all 0.2s ease;
      background: linear-gradient(135deg, #0072ff, #00b4ff);
      box-shadow: 0 5px 15px rgba(0,114,255,0.3);
    }
    .btn:hover { transform: translateY(-3px); }
    .btn.like { background: linear-gradient(135deg, #00c851, #007e33); }
    .btn.dislike { background: linear-gradient(135deg, #ff4444, #cc0000); }
    .emoji-row {
      margin-top: 10px;
      display: flex;
      justify-content: center;
      gap: 8px;
    }
    .emoji-btn {
      font-size: 22px;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid #ddd;
      background: white;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .emoji-btn:active { transform: scale(0.95); }
    .admin-link {
      display: block;
      margin-top: 16px;
      color: #ffd;
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="overlay"></div>
  <div class="container">
    <h1>Customer Feedback</h1>
    <h3>View the Image and Share Your Feedback</h3>

    <img src="{{ url_for('static', filename='images/SentimentBack.jpg') }}" alt="Feedback Image">

    {% if message %}
      <p style="color: lightgreen;">{{ message }}</p>
    {% elif error %}
      <p style="color: #ff4444;">{{ error }}</p>
    {% endif %}

    <form method="POST" action="/submit" id="feedbackForm">
      <textarea name="feedback" placeholder="Type or speak your feedback..." required></textarea>

      <div class="button-row">
        <button type="submit" class="btn">Submit</button>
      </div>

      <div class="button-row">
        <p>Want to give feedback by voice 🎤</p>
        <button type="button" id="voiceBtn" class="btn">🎤 Voice</button>
      </div>

      <div class="button-row">
        <button type="button" id="thumbUp" class="btn like">👍</button>
        <button type="button" id="thumbDown" class="btn dislike">👎</button>
      </div>

      <div class="emoji-row">
        <button class="emoji-btn">🔥</button>
        <button class="emoji-btn">😐</button>
        <button class="emoji-btn">😡</button>
        <button class="emoji-btn">😊</button>
        <button class="emoji-btn">😍</button>
      </div>

      <a href="/dashboard" class="admin-link">Go to Admin Dashboard</a>
    </form>
  </div>
</body>
</html>
